
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaMini</title>
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
    }
    header {
      background: white;
      color: #d62976;
      padding: 18px;
      font-size: 26px;
      font-weight: bold;
    }
    main {
      max-width: 450px;
      margin: 25px auto;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #00000010;
    }
    button {
      background: #d62976;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>📸 InstaMini</header>
  <main>
    <section class="card">
      <h2>Welcome to InstaMini!</h2>
      <p>Your own social media mini website.</p>
      <p>We're building this step by step.</p>
      <button onclick="alert('Your website is working!')">
        Test my website
      </button>
    </section>
  </main>
</body>
</html>
